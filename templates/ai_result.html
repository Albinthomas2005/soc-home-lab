<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | SOC AI Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #0b1120;
            color: #e5e7eb;
            font: 15px/1.7 Arial, sans-serif;
        }
        main {
            max-width: 900px;
            margin: 25px auto;
            padding: 25px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #142035;
        }
        h1 { color: #60a5fa; }
        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            padding: 18px;
            border-radius: 8px;
            background: #080d18;
            border: 1px solid #334155;
        }
        textarea {
            width: 100%;
            min-height: 260px;
            padding: 12px;
            box-sizing: border-box;
            background: #080d18;
            color: #e5e7eb;
            border: 1px solid #475569;
            border-radius: 8px;
        }
        button {
            margin-top: 10px;
            padding: 12px 16px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        a { color: #93c5fd; }
        .note { color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>
<main>
    <h1>{{ title }}</h1>
    <p class="note">
        Generated by the configured Gemini provider. Verify recommendations
        against the original Wazuh event before taking action.
    </p>

    {% if result_kind == "report" %}
        <form method="post" action="/export-report">
            <label for="report_text">Review and edit the improved report before exporting</label>
            <textarea id="report_text" name="report_text" required>{{ result }}</textarea>
            <button type="submit">Download Markdown report</button>
        </form>
    {% else %}
        <pre>{{ result }}</pre>
    {% endif %}

    {% if alert_id %}
        <p>Wazuh alert ID: <code>{{ alert_id }}</code></p>
    {% endif %}
    <p><a href="{{ url_for('dashboard', alert_id=alert_id) }}">Return to the SOC assistant</a></p>
</main>
</body>
</html>
